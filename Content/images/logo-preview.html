<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foodly Kitchen Logo Brand System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cinzel:wght@700;900&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8F9FA;
      padding: 40px;
      color: #333;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid #E5E7EB;
      text-align: center;
    }
    .card.dark {
      background: #111827;
      color: #FFFFFF;
    }
    .card h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9CA3AF;
      margin-bottom: 24px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    svg {
      max-width: 280px;
      height: auto;
    }
  </style>
</head>
<body>
  <div style="text-align: center; margin-bottom: 40px;">
    <h1 style="font-size: 28px; font-weight: 800; color: #111827; margin-bottom: 8px;">Foodly Kitchen — Vector Brand Identity</h1>
    <p style="color: #6B7280; font-size: 15px;">Official scalable vector logos crafted for digital, print, navbar, and mobile icon use.</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Light Background (Standard Horizontal)</h3>
      <div class="logo-container">
        <!-- SVG will be loaded here -->
        <img src="foodly-logo.svg" alt="Foodly Kitchen Logo" style="width: 260px;">
      </div>
    </div>

    <div class="card dark">
      <h3>Dark Surface / Inverted Footer</h3>
      <div class="logo-container">
        <img src="foodly-logo-white.svg" alt="Foodly Kitchen Logo Inverted" style="width: 260px;">
      </div>
    </div>

    <div class="card">
      <h3>Favicon / App Icon Mark</h3>
      <div class="logo-container">
        <img src="foodly-icon.svg" alt="Foodly Icon" style="width: 80px; height: 80px;">
      </div>
    </div>
  </div>
</body>
</html>
